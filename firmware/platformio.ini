[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_port = auto
monitor_port = auto

; Placa S3 H16R8: 16MB de flash y 8MB de PSRAM octal
board_build.flash_size = 16MB
board_build.psram = enabled

[env:esp32s3_rx]
; USB nativo TinyUSB (OTG) para exponer el interfaz MIDI al PC
lib_deps = fastled/FastLED @ ^3.7.0
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DARDUINO_USB_DFU_ON_BOOT=0
  -DROLE_RX=1

[env:esp32s3_tx]
; El TX no usa el USB para nada, asi que dejamos la consola por
; USB-Serial-JTAG y se puede ver que boton entra y que se envia.
lib_deps = fastled/FastLED @ ^3.7.0
build_unflags = -DARDUINO_USB_MODE=0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DROLE_TX=1
